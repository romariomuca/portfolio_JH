<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto mi resta — Jet per chi ha la partita IVA</title>
<meta name="description" content="Romario Muca — candidatura Product Designer per Jet HR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000000;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#FFFFFF}a:hover{color:#D9D9D9}
.btn{cursor:pointer;transition:background .2s,filter .2s}
.btn:focus-visible,.inp:focus-visible{outline:2px solid #3B5BDB;outline-offset:2px}
.btn-dark:hover{background:#2A2A2A}
.btn-light:hover{background:#F2F2F2}
.tab:hover{color:#FFFFFF}
.inp{transition:border-color .2s,background .2s}
.inp:hover{border-color:#D0D0CC}
.inp:focus{border-color:#111111;background:#FFFFFF;outline:none}
.inp:hover{border-color:#D0D0CC}
.bar-fill{transition:width .6s cubic-bezier(.22,1,.36,1),background .3s}
.num{transition:color .3s}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{animation:rise .5s cubic-bezier(.22,1,.36,1)}
.client:hover{border-color:#DADAD6}
.send-btn{transition:background .35s ease,transform .15s ease}
.send-btn:hover{filter:brightness(1.15)}
.send-btn:active{transform:scale(.97)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:14px;height:14px;border-radius:999px;border:2px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;animation:spin .7s linear infinite}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.check path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s cubic-bezier(.22,1,.36,1) .05s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.s-in{display:inline-block;animation:fadeUp .3s ease}
.seg{transition:background .3s ease,width .6s cubic-bezier(.22,1,.36,1)}
.seg-row{cursor:default;transition:color .3s ease}
.seg-row span span{transition:background .3s ease}
.jet{font-family:'Figtree',system-ui,sans-serif}
.navi:hover{background:#F4F4F2}
.paper{animation:rise .5s cubic-bezier(.22,1,.36,1)}
.next-btn{transition:background .3s,border-color .3s}
.next-btn:hover{background:#FFFFFF;color:#111111 !important;border-color:#FFFFFF}
.next-btn span{display:inline-block;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.next-btn:hover span{transform:translateX(4px)}
.home-link{transition:opacity .3s}
.home-link:hover{opacity:.6}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/liberi-professionisti.js"></script>
</body>
</html>
